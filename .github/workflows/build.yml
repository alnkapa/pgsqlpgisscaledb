name: "build image"

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      tag_name: ${{ github.run_number }}
      release_name: Release ${{ github.run_number }}
    steps:    
      - name: Checkout      
        uses: actions/checkout@v6
        with:
          submodules: true